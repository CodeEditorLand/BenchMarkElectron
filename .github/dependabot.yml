version: 2
enable-beta-ecosystems: true

updates:
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "daily"

    - package-ecosystem: "cargo"
      directory: "/"
      schedule:
          interval: "daily"
      versioning-strategy: lockfile-only
      

    - package-ecosystem: "npm"
      directory: "/apps/cpu_intensive"
      schedule:
          interval: "daily"
      versioning-strategy: increase
      ignore:
          - dependency-name: "tailwindcss"
            versions:
                - "^4.0.0"

    - package-ecosystem: "npm"
      directory: "/apps/file_transfer"
      schedule:
          interval: "daily"
      versioning-strategy: increase
      ignore:
          - dependency-name: "tailwindcss"
            versions:
                - "^4.0.0"

    - package-ecosystem: "npm"
      directory: "/apps/hello_world"
      schedule:
          interval: "daily"
      versioning-strategy: increase
      ignore:
          - dependency-name: "tailwindcss"
            versions:
                - "^4.0.0"

    - package-ecosystem: "cargo"
      directory: "/bench/tools"
      schedule:
          interval: "daily"
      versioning-strategy: lockfile-only
      
